<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/principal :: layout(~{::main}, 'Historial de Ventas', 'listaventas'
	  , ~{},~{}
	  )}">
<body>
    <main>
        <div class="card p-4 shadow-sm">
            <div class="d-flex justify-content-between mb-3">
                <h5 class="fw-bold">Lista General de Ventas</h5>
            </div>
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>N° Comprobante</th>
                        <th>Fecha</th>
                        <th>Cajero</th>
                        <th>Total</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="venta : ${ventas}">
                        <td class="fw-bold" th:text="${venta.numeroComprobante}"></td>
                        <td th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${venta.usuario.nombre}"></td>
                        <td class="fw-bold text-success" th:text="'S/ ' + ${venta.total}"></td>
                        <td>
                            <span class="badge bg-success" th:if="${venta.estado == 'Completado'}">Completado</span>
                            <span class="badge bg-danger" th:if="${venta.estado == 'Anulado'}">Anulado</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
