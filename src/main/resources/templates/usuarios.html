<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/principal :: layout(~{::contenido}, 'Usuarios', 'usuarios', ~{}, ~{})}">

<body>
    <section th:fragment="contenido" th:with="editando=${nuevoUsuario.id_usuario != null}">

        <div th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>
        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-4" th:text="${editando ? 'Editar usuario' : 'Registrar usuario'}">
                    Registrar usuario
                </h5>

                <form th:action="@{/usuarios/guardar}"
                      th:object="${nuevoUsuario}"
                      method="post"
                      class="row g-3">
                    <input type="hidden" th:field="*{id_usuario}">

                    <div class="col-md-6 col-xl-4">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input id="nombre" type="text" class="form-control"
                               th:field="*{nombre}" placeholder="Ej. Juan"
                               autocomplete="given-name" required>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="apellido" class="form-label">Apellido</label>
                        <input id="apellido" type="text" class="form-control"
                               th:field="*{apellido}" placeholder="Ej. Pérez"
                               autocomplete="family-name" required>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="username" class="form-label">Usuario</label>
                        <input id="username" type="text" class="form-control"
                               th:field="*{username}" placeholder="Ej. jperez"
                               autocomplete="username" required>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input id="correo" type="email" class="form-control"
                               th:field="*{correo}" placeholder="Ej. jperez@dcolores.com"
                               autocomplete="email" required>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input id="telefono" type="text" class="form-control"
                               th:field="*{telefono}" placeholder="Ej. 987654321"
                               inputmode="numeric" autocomplete="tel-national"
                               pattern="[0-9]{9}" minlength="9" maxlength="9"
                               title="Ingresa un teléfono de 9 dígitos." required>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="rol" class="form-label">Rol</label>
                        <select id="rol" name="rol" class="form-select" required>
                            <option value="" disabled th:selected="${nuevoUsuario.rol == null or nuevoUsuario.rol == ''}">Selecciona un rol</option>
                            <option value="ADMIN" th:selected="${nuevoUsuario.rol == 'ADMIN'}">Administrador</option>
                            <option value="CAJERO" th:selected="${nuevoUsuario.rol == 'CAJERO'}">Cajero</option>
                            <option value="GERENTE" th:selected="${nuevoUsuario.rol == 'GERENTE'}">Gerente</option>
                        </select>
                    </div>

                    <div class="col-md-6 col-xl-4">
                        <label for="password" class="form-label">
                            Contraseña <span th:if="${editando}" class="text-muted">(opcional)</span>
                        </label>
                        <input id="password" name="password" type="password" class="form-control"
                               autocomplete="new-password" aria-describedby="passwordAyuda"
                               th:placeholder="${editando ? 'Sin cambios' : 'Ingresa una contraseña'}"
                               th:required="${!editando}">
                        <div id="passwordAyuda" class="form-text"
                             th:text="${editando ? 'Deja este campo vacío para conservar la contraseña actual.' : 'Define una contraseña para el nuevo usuario.'}">
                            Define una contraseña para el nuevo usuario.
                        </div>
                    </div>

                    <div class="col-12 d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-primary"
                                th:text="${editando ? 'Actualizar' : 'Guardar'}">Guardar</button>
                        <a th:if="${editando}" th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Usuarios registrados</h5>
                <div class="table-responsive overflow-y-hidden">
                    <table class="table align-middle mb-0">
                        <caption class="visually-hidden">Listado de usuarios y acciones para editar o cambiar su estado.</caption>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Usuario</th>
                                <th scope="col">Nombre completo</th>
                                <th scope="col">Correo</th>
                                <th scope="col">Teléfono</th>
                                <th scope="col">Rol</th>
                                <th scope="col">Estado</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="empleado : ${usuarios}">
                                <td th:text="${empleado.id_usuario}"></td>
                                <td th:text="${empleado.username}"></td>
                                <td th:text="${empleado.nombre + ' ' + empleado.apellido}"></td>
                                <td th:text="${empleado.correo}"></td>
                                <td class="text-nowrap" th:text="${empleado.telefono}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${empleado.rol == 'ADMIN' ? 'bg-primary' : (empleado.rol == 'GERENTE' ? 'bg-info text-dark' : 'bg-secondary')}"
                                          th:text="${empleado.rol}"></span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${empleado.activo == true ? 'bg-success' : 'bg-danger'}"
                                          th:text="${empleado.activo == true ? 'Activo' : 'Inactivo'}"></span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/usuarios/editar/{id}(id=${empleado.id_usuario})}"
                                           class="btn btn-outline-primary btn-sm">Editar</a>
                                        <form th:action="@{/usuarios/estado/{id}(id=${empleado.id_usuario})}" method="post">
                                            <button type="submit" class="btn btn-sm"
                                                    th:classappend="${empleado.activo == true ? 'btn-outline-danger' : 'btn-outline-success'}"
                                                    th:text="${empleado.activo == true ? 'Desactivar' : 'Activar'}"></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(usuarios)}">
                                <td colspan="8" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
