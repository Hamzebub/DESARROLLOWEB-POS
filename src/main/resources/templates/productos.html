<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/principal :: layout(~{::contenido}, 'Productos', 'productos', ~{::cssPagina}, ~{::jsPagina})}">

<body>
    <section th:fragment="contenido">

        <!-- Formulario para guardar / editar un producto -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="mb-3" th:text="${editando} ? 'Editar producto' : 'Nuevo producto'"></h5>

                <form th:action="@{/productos/guardar}"
                      th:object="${nuevoProducto}"
                      method="post"
                      class="row g-3 align-items-end">

                    <input type="hidden" th:field="*{idProducto}">
                    <input type="hidden" th:field="*{activo}">

                    <div class="col-md-2">
                        <label for="sku" class="form-label">SKU</label>
                        <input id="sku" type="text" class="form-control"
                               th:field="*{sku}" placeholder="PROD-001" required>
                    </div>

                    <div class="col-md-4">
                        <label for="nombre" class="form-label">Nombre del producto</label>
                        <input id="nombre" type="text" class="form-control"
                               th:field="*{nombre}" placeholder="Ej. Fideos 250g" required>
                    </div>

                    <div class="col-md-3">
                        <label for="idCategoria" class="form-label">Categoría</label>
                        <select id="idCategoria" name="idCategoria" class="form-select" required>
                            <option value="" disabled
                                    th:selected="${nuevoProducto.categoria == null}">Seleccione</option>
                            <option th:each="c : ${categorias}"
                                    th:value="${c.idCategoria}"
                                    th:text="${c.nombre}"
                                    th:selected="${nuevoProducto.categoria != null and nuevoProducto.categoria.idCategoria == c.idCategoria}"></option>
                        </select>
                    </div>

                    <div class="col-md-1">
                        <label for="stockActual" class="form-label">Stock</label>
                        <input id="stockActual" type="number" min="0" class="form-control"
                               th:field="*{stockActual}" required>
                    </div>

                    <div class="col-md-2">
                        <label for="stockMinimo" class="form-label">Stock mínimo</label>
                        <input id="stockMinimo" type="number" min="0" class="form-control"
                               th:field="*{stockMinimo}" required>
                    </div>

                    <div class="col-md-2">
                        <label for="precioCompra" class="form-label">P. compra (S/)</label>
                        <input id="precioCompra" type="number" step="0.01" min="0" class="form-control"
                               th:field="*{precioCompra}" required>
                    </div>

                    <div class="col-md-2">
                        <label for="precioVenta" class="form-label">P. venta (S/)</label>
                        <input id="precioVenta" type="number" step="0.01" min="0" class="form-control"
                               th:field="*{precioVenta}" required>
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100"
                                th:text="${editando} ? 'Actualizar' : 'Guardar'">Guardar</button>
                    </div>

                    <div class="col-md-2" th:if="${editando}">
                        <a th:href="@{/productos}" class="btn btn-outline-secondary w-100">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de productos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Stock</th>
                                <th>Stock mín.</th>
                                <th>P. compra</th>
                                <th>P. venta</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.sku}"></td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="${p.categoria != null} ? ${p.categoria.nombre} : '-'"></td>
                                <td th:text="${p.stockActual}"></td>
                                <td th:text="${p.stockMinimo}"></td>
                                <td th:text="${'S/ ' + #numbers.formatDecimal(p.precioCompra, 1, 2)}"></td>
                                <td th:text="${'S/ ' + #numbers.formatDecimal(p.precioVenta, 1, 2)}"></td>
                                <td>
                                    <span th:if="${p.stockActual == 0}" class="badge bg-danger">Agotado</span>
                                    <span th:if="${p.stockActual gt 0 and p.stockActual lt p.stockMinimo}"
                                          class="badge bg-warning text-dark">Bajo</span>
                                    <span th:if="${p.stockActual gt 0 and p.stockActual ge p.stockMinimo}"
                                          class="badge bg-success">OK</span>
                                </td>
                                <td>
                                    <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}"
                                       class="btn btn-sm btn-outline-primary">Editar</a>
                                </td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="9" class="text-center text-muted">
                                    No hay productos registrados.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </section>

    <th:block th:fragment="cssPagina"></th:block>
    <th:block th:fragment="jsPagina"></th:block>
</body>
</html>
