<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/principal :: layout(~{::contenido}, 'Categorías', 'categorias'
	  , ~{},~{}
	  )}">

<body>
    <section th:fragment="contenido">

        <!-- Formulario para guardar una categoría -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/categorias/guardar}"
                      th:object="${nuevaCategoria}"
                      method="post"
                      class="row g-3 align-items-end">

                    <div class="col-md-5">
                        <label for="nombre" class="form-label">Nombre de categoría</label>
                        <input id="nombre"
                               type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               placeholder="Ej. Abarrotes"
                               required>
                    </div>

                    <div class="col-md-4">
                        <label for="descripcion" class="form-label">
                            Descripción <span class="text-muted">(opcional)</span>
                        </label>
                        <input id="descripcion"
                               type="text"
                               class="form-control"
                               th:field="*{descripcion}"
                               placeholder="Descripción">
                    </div>

                    <div class="col-md-1">
						<input type="hidden" th:field="*{idCategoria}">
						<button type="submit" class="btn btn-primary w-100"
						        th:text="${editando} ? 'Actualizar' : 'Guardar'">
						    Guardar
						</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla de categorías -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre de categoría</th>
                                <th>Descripción</th>
                                <th>Estado</th>
							   <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:each="categoria : ${categorias}">
                                <td th:text="${categoria.idCategoria}"></td>
                                <td th:text="${categoria.nombre}"></td>
							   <td th:text="${categoria.descripcion}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${categoria.activo} ? ' bg-success' : ' bg-danger'"
                                          th:text="${categoria.activo} ? 'Activo' : 'Inactivo'">                                       
                                    </span>
                                </td>
								<td>
								    <div class="d-flex gap-2">
								        <a th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}"
								           class="btn btn-outline-primary btn-sm">Editar</a>

								        <form th:action="@{/categorias/estado/{id}(id=${categoria.idCategoria})}"
								              method="post">
								            <button type="submit" class="btn btn-sm"
								                    th:classappend="${categoria.activo == true ? 'btn-outline-danger' : 'btn-outline-success'}"
								                    th:text="${categoria.activo == true ? 'Desactivar' : 'Activar'}">
								            </button>
								        </form>
								    </div>
								</td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(categorias)}">
                                <td colspan="4" class="text-center text-muted">
                                    No hay categorías registradas.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </section>
</body>
</html>
