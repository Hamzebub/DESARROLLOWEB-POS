<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - D'Colores POS</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .login-card { max-width: 400px; margin: auto; margin-top: 10vh; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .brand-logo { width: 50px; height: 50px; background-color: #e74c3c; color: white; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card login-card p-4">
            <div class="text-center mb-4">
                <div class="brand-logo mb-2">D</div>
                <h4 class="fw-bold">Bodega D'Colores</h4>
                <p class="text-muted">Sistema de Gestión de Ventas</p>
            </div>
            
            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Ingrese su contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="background-color: #0d6efd; border: none;">Ingresar al Sistema</button>
            </form>
        </div>
    </div>
</body>
</html>
