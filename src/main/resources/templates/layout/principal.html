
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(contenido, titulo, seccion,cssPagina, jsPagina)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo} + ' - D\'Colores POS'">
        D'Colores POS
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/principal.css}">
	<th:block th:replace="${cssPagina}"></th:block>
</head>

<body>

    <div class="d-flex app-shell">

        <!-- Menú lateral compartido -->
        <div th:replace="~{fragments/sidebar :: sidebar}">
        </div>

        <!-- Área de trabajo -->
        <div class="workspace flex-grow-1">

            <!-- Encabezado compartido -->
            <div th:replace="~{fragments/header :: header(${titulo})}">
            </div>

            <!-- Contenido particular de cada página -->
            <main class="page-content">
                <div th:replace="${contenido}">
                    Contenido de la página
                </div>
            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
	<th:block th:replace="${jsPagina}"></th:block>

</body>
</html>
