<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/principal :: layout(~{::main}, 'Dashboard Principal', 'dashboard'
	  , ~{},~{::jsPagina}
	  )}">

<body>

    <main>

        <!-- KPIs -->
        <div class="row g-3 mb-4">

            <div class="col-6 col-md-3">
                <div class="card kpi-card p-3 h-100">
                    <small class="text-muted">Ventas del día</small>
                    <h5 class="fw-bold mt-1"
                        th:text="${ventasDelDia}">S/ 0.00</h5>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card kpi-card p-3 h-100">
                    <small class="text-muted">Productos en stock</small>
                    <h5 class="fw-bold mt-1"
                        th:text="${productosStock}">0</h5>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card kpi-card p-3 h-100">
                    <small class="text-muted">Mermas del mes</small>
                    <h5 class="fw-bold mt-1"
                        th:text="${mermasDelMes}">0 items</h5>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card kpi-card p-3 h-100">
                    <small class="text-muted">Ingresos del mes</small>
                    <h5 class="fw-bold mt-1"
                        th:text="${ingresosMes}">S/ 0.00</h5>
                </div>
            </div>

        </div>

        <!-- Últimas ventas -->
        <div class="card kpi-card p-3 p-md-4">

            <h6 class="fw-bold mb-3">Últimas ventas</h6>

            <div class="table-responsive">
                <table class="table table-custom align-middle">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Producto</th>
                            <th>Total</th>
                            <th>Medio de pago</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="venta : ${ultimasVentasDTO}">
                            <td th:text="${#temporals.format(venta.fechaHora, 'dd/MM/yyyy HH:mm')}">00:00</td>
                            <td th:text="${venta.productosConcatenados}">Producto</td>
                            <td class="fw-bold text-success"
                                th:text="'S/ ' + ${venta.total}">S/ 0.00</td>
                            <td>
                                <span th:each="pago : ${venta.pagos}" 
								class="badge"
								th:classappend="${pago.metodoPago == 'EFECTIVO' ? 'bg-success' : 
								                (pago.metodoPago == 'YAPE_PLIN' ? 'bg-info text-dark' : 
								                (pago.metodoPago == 'TARJETA' ? 'bg-primary' : 'bg-secondary'))}"
								
                                      th:text="${pago.metodoPago}">
                                    Pago
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </main>
	
	<th:block th:fragment="jsPagina">
		<script th:inline="javascript">
		    //const DB_CATEGORIAS = /*[[${categorias}]]*/ [];
			const DBB= /*[[${ultimasVentasDTO}]]*/ [];
			
			console.log(DBB);
		    
		</script>
		
	</th:block>

</body>
</html>
